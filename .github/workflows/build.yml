name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -o "*.zip" -d out || true
      - run: |
          POM=$(find . -name pom.xml -not -path "*/node_modules/*" | head -n 1)
          echo "Using $POM"
          mvn -B -f "$POM" clean package
      - run: find . -name "*.jar" -path "*target*"
      - uses: actions/upload-artifact@v4
        with:
          name: pvpbot-jar
          path: "**/target/PvPBot-*.jar"
          if-no-files-found: error
